<!doctype html>
<html lang="en-GB" data-theme="system">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Dueproof</title>
    <script type="module" src="./main.ts"></script>
  </head>
  <body>
    <main class="setup">
      <header class="setup-header">
        <img class="mark" src="./mark.svg" alt="" width="40" height="40" />
        <h1>Connect to Dueproof</h1>
        <p class="lede">
          Enter the address of your Dueproof server. Ask whoever runs it if you don't know it.
        </p>
      </header>

      <form id="connect-form" class="card" novalidate>
        <label for="server-url">Server address</label>
        <input
          id="server-url"
          name="url"
          type="url"
          inputmode="url"
          autocomplete="url"
          autocapitalize="off"
          spellcheck="false"
          placeholder="https://dueproof.example.com"
          aria-describedby="status hint"
          required
        />
        <p id="hint" class="hint">
          It starts with https://. Plain http:// works only for a server on this computer.
        </p>
        <p id="status" class="status" role="status" aria-live="polite" hidden></p>
        <div class="actions">
          <button id="cancel" type="button" class="button secondary" hidden>Cancel</button>
          <button id="check" type="button" class="button secondary">Check</button>
          <button id="connect" type="submit" class="button primary">Connect</button>
        </div>
      </form>

      <section class="card options" aria-labelledby="options-title">
        <h2 id="options-title">On this computer</h2>
        <label class="check">
          <input id="autostart" type="checkbox" />
          <span>Start Dueproof when I sign in to this computer</span>
        </label>
        <label class="check">
          <input id="updates" type="checkbox" />
          <span>
            Check for updates when Dueproof starts
            <small id="updates-note" class="hint"></small>
          </span>
        </label>
      </section>

      <footer class="foot">
        <span id="version"></span>
      </footer>
    </main>
  </body>
</html>
