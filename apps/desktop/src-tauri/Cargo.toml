[package]
name = "dueproof-desktop"
version = "0.1.1"
description = "Dueproof desktop shell (Tauri 2)"
authors = ["Maanav Krishna"]
license-file = "../../../LICENSE"
edition = "2021"
rust-version = "1.90"
publish = false

[lib]
name = "dueproof_desktop_lib"
# Desktop only (no mobile targets), so no staticlib/cdylib.
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["tray-icon", "image-png"] }
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-autostart = "2"
tauri-plugin-updater = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
tokio = { version = "1", features = ["time"] }
log = "0.4"
getrandom = "0.4"

[target.'cfg(any(target_os = "linux", target_os = "windows", target_os = "macos"))'.dependencies]
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = { version = "0.2", optional = true }

[features]
default = []
# Local mode spike: run the app server and engine as sidecars on 127.0.0.1.
local-mode = ["dep:libc"]

# Dev builds without debug info: the full Tauri tree is several GB otherwise.
[profile.dev]
debug = 0
incremental = false

[profile.dev.package."*"]
debug = 0

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
