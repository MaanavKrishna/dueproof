[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

# Dueproof engine: a stateless HTTP service that reads, OCRs, translates,
# finds obligations in and proves quotes on notices. The TypeScript app calls
# it (packages/contracts/src/engine.ts is the contract).
#
# One codebase, two deployment shapes (design record 03 §3a):
#
#   engine-fast   the base install (`uv sync --no-default-groups`): PDFium text
#                 layer, page images, PaddleOCR on ONNX Runtime (numpy + Pillow,
#                 no OpenCV), rules, linking. No torch. Sized for a Vercel Python
#                 Function (< 250 MB unpacked; see README.md for the measurement).
#   engine-heavy  `uv sync --group heavy`: adds Tesseract's wrapper with OpenCV
#                 and IndicTrans2 (torch CPU, transformers). Docker / Vercel Sandbox.
#
# `fast` is declared as an empty group so `--group fast` reads the same as
# `--group heavy`; the base install *is* engine-fast.
[project]
name = "dueproof-engine"
dynamic = ["version"]
description = "Dueproof's engine: read notices, find what is owed and by when, and prove every finding on its page."
license = "LicenseRef-PolyForm-Shield-1.0.0"
requires-python = ">=3.12"
authors = [{ name = "The Dueproof Authors" }]
dependencies = [
    "fastapi>=0.141,<1",
    "httpx>=0.28,<1",
    "numpy>=2.2,<3",
    "onnxruntime>=1.22,<2",
    "pillow>=11",
    "pypdfium2>=5,<6",
    "rapidfuzz>=3.14,<4",
    "uvicorn>=0.34,<1",
]

[dependency-groups]
fast = []
# Rung 3 of the OCR ladder. Also needs the tesseract binary and language packs.
tesseract = [
    "opencv-python-headless>=4.11",
    "pytesseract==0.3.13",
]
heavy = [
    { include-group = "tesseract" },
    "huggingface-hub",
    "indictranstoolkit==1.1.1",
    "sentencepiece>=0.2.0",
    # The CPU build only, installed from PyTorch's CPU index before `uv sync`
    # (see Dockerfile): the CUDA build is gigabytes, and NVIDIA's proprietary
    # libraries, that the engine never uses. Keep this equal to the version in
    # uv.lock and in the CPU installs.
    "torch==2.15.0",
    # <5: IndicTransToolkit needs transformers.tokenization_utils.PreTrainedTokenizerBase.
    # 4.57.6 has advisories with no 4.x fix (PYSEC-2025-217, PYSEC-2026-2288,
    # -2289, -2290, -3929, -4174). None is reachable here: no Trainer, no
    # conversion scripts, no save_pretrained, no LightGlue; the model folder is
    # local, each file in it is checked against a pinned SHA-256 before loading,
    # loading is local_files_only and HF_HUB_OFFLINE=1. The way out is
    # transformers>=5.10, once IndicTransToolkit supports 5.x.
    "transformers==4.57.6",
]
dev = [
    { include-group = "tesseract" },
    "pyflakes",
    "pytest>=8",
]

[tool.uv]
default-groups = ["dev"]

# TODO: lock torch to PyTorch's CPU index, so `uv lock` and `uv sync` can
# never pick the CUDA build. Needs a `uv lock` run where
# download.pytorch.org is reachable; until then every install puts
# torch==2.15.0 from the CPU index in place first (Dockerfile, CI, Sandbox).
#
# [[tool.uv.index]]
# name = "pytorch-cpu"
# url = "https://download.pytorch.org/whl/cpu"
# explicit = true
#
# [tool.uv.sources]
# torch = { index = "pytorch-cpu" }

[tool.setuptools.dynamic]
version = { attr = "dueproof_engine.__version__" }

[tool.setuptools.packages.find]
include = ["dueproof_engine*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
