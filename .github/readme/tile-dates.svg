<svg xmlns="http://www.w3.org/2000/svg" width="560" height="640" viewBox="0 0 560 640" role="img" aria-label="Dates are computed, never generated. The quote 'within 30 days of receipt' becomes a date rule: relative, anchor receipt, amount 30, unit days. The date engine in packages/core turns it into 23 Nov 2026."><title>Dates are computed, never generated. The quote 'within 30 days of receipt' becomes a date rule: relative, anchor receipt, amount 30, unit days. The date engine in packages/core turns it into 23 Nov 2026.</title><style>@font-face{font-family:'DP Medium 0';src:url(data:font/woff2;base64,) format('woff2');font-weight:500;font-style:normal}.fb{font-family:'DP Medium 0',-apple-system, 'Segoe UI', system-ui, sans-serif;font-weight:500;font-feature-settings:'cv11','ss01','ss03';}@font-face{font-family:'DP Mono 0';src:url(data:font/woff2;base64,) format('woff2');font-weight:500;font-style:normal}.fm{font-family:'DP Mono 0',ui-monospace, Menlo, Consolas, monospace;font-weight:500;}@font-face{font-family:'DP Mono Bold 0';src:url(data:font/woff2;base64,) format('woff2');font-weight:700;font-style:normal}.fmb{font-family:'DP Mono Bold 0',ui-monospace, Menlo, Consolas, monospace;font-weight:700;}@font-face{font-family:'DP Semibold 0';src:url(data:font/woff2;base64,) format('woff2');font-weight:600;font-style:normal}.fs{font-family:'DP Semibold 0',-apple-system, 'Segoe UI', system-ui, sans-serif;font-weight:600;font-feature-settings:'cv11','ss01','ss03';}@font-face{font-family:'DP Display 0';src:url(data:font/woff2;base64,) format('woff2');font-weight:800;font-style:normal}.fx{font-family:'DP Display 0',-apple-system, 'Segoe UI', system-ui, sans-serif;font-weight:800;font-feature-settings:'cv11','ss01','ss03';}
@media (prefers-reduced-motion:no-preference){
.fade{animation:fade .9s cubic-bezier(.2,.8,.2,1) both}
.wipe{transform-box:fill-box;transform-origin:left center;animation:wipe 1.1s cubic-bezier(.65,0,.25,1) both}
.draw{stroke-dasharray:1;animation:draw 1.6s cubic-bezier(.65,0,.25,1) both}
.pop{transform-box:fill-box;transform-origin:center;animation:pop .55s cubic-bezier(.3,1.5,.5,1) both}
.flow{animation:flow 1.2s linear infinite}
.pulse{animation:pulse 2s ease-in-out infinite}
}
@keyframes fade{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes wipe{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}
@keyframes flow{to{stroke-dashoffset:-20}}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
</style><defs><clipPath id="clip"><rect width="560" height="640" rx="28"/></clipPath><filter id="tsh" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="9.0" flood-color="#0B0D10" flood-opacity="0.16"/></filter></defs><g clip-path="url(#clip)"><rect width="560" height="640" fill="#1F3A8A"/><text x="34.0" y="60.0" class="fmb" font-size="18" fill="#FFFFFF" letter-spacing="1" >02</text><text x="74.0" y="60.0" class="fm" font-size="16" fill="#C2D0FF" letter-spacing="1.6" >NEVER GENERATED</text><g transform="translate(32,96)"><rect class="wipe" x="89" y="0" width="318" height="44" rx="6" fill="#FCDD9A" stroke="#B87300" stroke-width="2"/><text x="248.0" y="29.0" class="fs" font-size="22" fill="#15181D" text-anchor="middle" >“within 30 days of receipt”</text><path d="M248.0,52.0L248.0,84.0" fill="none" stroke="#C2D0FF" stroke-width="2" stroke-linecap="round"/><path d="M244.0,77.1L248.0,84.0L252.0,77.1" fill="none" stroke="#C2D0FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="38.0" y="92" width="420" height="136" rx="12" fill="#152862"/><text x="442.0" y="116.0" class="fmb" font-size="12" fill="#A3B8FF" text-anchor="end" letter-spacing="1.5" >DATERULE</text><g class="fade" style="animation-delay:0.4s"><text x="62.0" y="126" class="fm" font-size="17" fill="#C2D0FF" xml:space="preserve">{ "type": <tspan fill="#FFFFFF">"relative",</tspan></text></g><g class="fade" style="animation-delay:0.5s"><text x="62.0" y="152" class="fm" font-size="17" fill="#C2D0FF" xml:space="preserve">  "anchor": <tspan fill="#FFFFFF">"receipt",</tspan></text></g><g class="fade" style="animation-delay:0.6s"><text x="62.0" y="178" class="fm" font-size="17" fill="#C2D0FF" xml:space="preserve">  "amount": <tspan fill="#FFFFFF">30,</tspan></text></g><g class="fade" style="animation-delay:0.7s"><text x="62.0" y="204" class="fm" font-size="17" fill="#C2D0FF" xml:space="preserve">  "unit": <tspan fill="#FFFFFF">"days" }</tspan></text></g><path d="M248.0,236.0L248.0,266.0" fill="none" stroke="#C2D0FF" stroke-width="2" stroke-linecap="round"/><path d="M244.0,259.1L248.0,266.0L252.0,259.1" fill="none" stroke="#C2D0FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="262.0" y="258.0" class="fm" font-size="14" fill="#A3B8FF" >packages/core</text><g class="pop" style="animation-delay:1.1s"><rect x="98.0" y="272" width="300" height="56" rx="28" fill="#FFFFFF"/><text x="248.0" y="309.0" class="fx" font-size="28" fill="#1F3A8A" text-anchor="middle" letter-spacing="-0.6" >23 Nov 2026</text></g></g><line x1="34" y1="450" x2="526" y2="450" stroke="#3B55A6"/><text x="32.0" y="516.0" class="fx" font-size="52" fill="#FFFFFF" letter-spacing="-1.6" >Dates are computed</text><text x="34.0" y="562.0" class="fb" font-size="24" fill="#FFFFFF" >Rules turn words into a date rule.</text><text x="34.0" y="596.0" class="fb" font-size="24" fill="#C2D0FF" >One date engine turns it into a date.</text></g></svg>