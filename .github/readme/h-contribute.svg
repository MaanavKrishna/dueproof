<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="112" viewBox="0 0 1600 112" role="img" aria-label="Contributing"><title>Contributing</title><style>@font-face{font-family:'DP Mono 0';src:url(data:font/woff2;base64,) format('woff2');font-weight:500;font-style:normal}.fm{font-family:'DP Mono 0',ui-monospace, Menlo, Consolas, monospace;font-weight:500;}@font-face{font-family:'DP Mono Bold 0';src:url(data:font/woff2;base64,) format('woff2');font-weight:700;font-style:normal}.fmb{font-family:'DP Mono Bold 0',ui-monospace, Menlo, Consolas, monospace;font-weight:700;}@font-face{font-family:'DP Display 0';src:url(data:font/woff2;base64,) format('woff2');font-weight:800;font-style:normal}.fx{font-family:'DP Display 0',-apple-system, 'Segoe UI', system-ui, sans-serif;font-weight:800;font-feature-settings:'cv11','ss01','ss03';}
@media (prefers-reduced-motion:no-preference){
.fade{animation:fade .9s cubic-bezier(.2,.8,.2,1) both}
.wipe{transform-box:fill-box;transform-origin:left center;animation:wipe 1.1s cubic-bezier(.65,0,.25,1) both}
.draw{stroke-dasharray:1;animation:draw 1.6s cubic-bezier(.65,0,.25,1) both}
.pop{transform-box:fill-box;transform-origin:center;animation:pop .55s cubic-bezier(.3,1.5,.5,1) both}
.flow{animation:flow 1.2s linear infinite}
.pulse{animation:pulse 2s ease-in-out infinite}
}
@keyframes fade{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes wipe{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}
@keyframes flow{to{stroke-dashoffset:-20}}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
</style><text x="2.0" y="74.0" class="fx" font-size="54" fill="#4766DA" letter-spacing="-1.6" >Contributing</text><text x="338.8" y="74.0" class="fmb" font-size="18" fill="#4766DA" letter-spacing="1" >09</text><text x="1596.0" y="72.0" class="fm" font-size="17" fill="#6B727D" text-anchor="end" letter-spacing="2" >AND REPORTING SECURITY PROBLEMS</text><rect class="wipe" x="4" y="98" width="120" height="5" rx="2.5" fill="#4766DA"/></svg>