name: release
on:
  push:
    tags: ["v*"]
  # Or from the Actions tab: "Run workflow" on main, with the version to release.
  # The workflow then creates the tag on that commit itself.
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag to create and release, e.g. v0.1.0"
        required: true
        type: string

# The input reaches the scripts only through this variable, never through
# ${{ }} inside a script, and every job checks its shape before using it.
env:
  TAG: ${{ inputs.tag || github.ref_name }}

# Nothing can write by default. Only the publish job, which runs no
# third-party action, gets contents: write.
permissions:
  contents: read

# Every action is pinned to a full commit SHA (the version is in the comment);
# Dependabot moves them (.github/dependabot.yml).

jobs:
  notes:
    name: Release notes from CHANGELOG.md
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      prerelease: ${{ steps.notes.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Release notes from the changelog
        id: notes
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::'$TAG' is not a version tag like v0.1.0"
            exit 1
          fi
          version="${TAG#v}"
          # The section is everything between "## <version> …" and the next "## ".
          heading=$(awk -v v="$version" '/^## / && $2 == v { print; exit }' CHANGELOG.md)
          if [ -z "$heading" ]; then
            echo "::error::CHANGELOG.md has no '## $version' section"
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/notes"
          awk -v v="$version" '
            /^## / { if (found) exit; if ($2 == v) { found = 1; next } }
            found { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/notes/notes.md"
          if [ ! -s "$RUNNER_TEMP/notes/notes.md" ]; then
            echo "::error::The '## $version' section of CHANGELOG.md is empty"
            exit 1
          fi
          prerelease=false
          # Only a suffixed tag (v0.2.0-rc.1) is a pre-release. A plain version is
          # published as Latest, so it shows in the repository sidebar; a beta
          # says so in its notes.
          if [[ "$TAG" == *-* ]]; then
            prerelease=true
          fi
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "Release $TAG (prerelease: $prerelease) from: $heading"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes
          path: ${{ runner.temp }}/notes/notes.md
          if-no-files-found: error
          retention-days: 7

  desktop-linux:
    name: Desktop app for Linux (.deb and AppImage)
    needs: notes
    # The oldest supported Ubuntu, so the AppImage and .deb run on as many
    # distributions as possible (they need this glibc or newer).
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    # Builds with a read-only token and hands the files to the publish job.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: WebKitGTK and the other Tauri build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Rust (stable, with rustup on the runner)
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          rustc --version
      # No build cache: a release is built from a clean tree.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - name: Build the .deb and the AppImage (Cargo.lock as committed)
        run: pnpm --filter @dueproof/desktop exec tauri build --bundles deb,appimage -- --locked
      - name: Collect them, with checksums
        run: |
          out="$RUNNER_TEMP/desktop"
          mkdir -p "$out"
          bundle=apps/desktop/src-tauri/target/release/bundle
          cp "$bundle"/deb/*.deb "$bundle"/appimage/*.AppImage "$out"/
          cd "$out"
          ls -1 | grep -qE '\.deb$' && ls -1 | grep -qE '\.AppImage$'
          sha256sum *.deb *.AppImage > SHA256SUMS-desktop-linux.txt
          cat SHA256SUMS-desktop-linux.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-linux
          path: ${{ runner.temp }}/desktop/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish the GitHub Release
    needs: [notes, desktop-linux]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The only job that can write. It runs no third-party action and no code
    # from the repository: it downloads the files the other jobs built and
    # calls gh.
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-notes
          path: ${{ runner.temp }}/notes
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: desktop-linux
          path: ${{ runner.temp }}/desktop

      - name: Check the files against their checksums
        working-directory: ${{ runner.temp }}/desktop
        run: sha256sum --check --strict SHA256SUMS-desktop-linux.txt

      - name: Create the release with the desktop files
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ needs.notes.outputs.prerelease }}
          EVENT: ${{ github.event_name }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::'$TAG' is not a version tag like v0.1.0"
            exit 1
          fi
          flags=()
          if [ "$PRERELEASE" = "true" ]; then flags+=(--prerelease); else flags+=(--latest); fi
          if [ "$EVENT" = "push" ]; then
            flags+=(--verify-tag)
          else
            # Started by hand: create the tag on the commit this run built.
            flags+=(--target "$GITHUB_SHA")
          fi
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Dueproof $TAG" \
            --notes-file "$RUNNER_TEMP/notes/notes.md" \
            "${flags[@]}" \
            "$RUNNER_TEMP"/desktop/*
