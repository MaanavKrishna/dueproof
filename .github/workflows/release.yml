name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: GitHub Release from CHANGELOG.md
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Release notes from the changelog
        id: notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          # The section is everything between "## <version> …" and the next "## ".
          heading=$(awk -v v="$version" '/^## / && $2 == v { print; exit }' CHANGELOG.md)
          if [ -z "$heading" ]; then
            echo "::error::CHANGELOG.md has no '## $version' section"
            exit 1
          fi
          awk -v v="$version" '
            /^## / { if (found) exit; if ($2 == v) { found = 1; next } }
            found { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          if [ ! -s "$RUNNER_TEMP/notes.md" ]; then
            echo "::error::The '## $version' section of CHANGELOG.md is empty"
            exit 1
          fi
          prerelease=false
          if [[ "$TAG" == *-* ]] || grep -qi 'beta' <<< "$heading"; then
            prerelease=true
          fi
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "Release $TAG (prerelease: $prerelease) from: $heading"

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ steps.notes.outputs.prerelease }}
        run: |
          flags=()
          if [ "$PRERELEASE" = "true" ]; then flags+=(--prerelease); fi
          gh release create "$TAG" \
            --verify-tag \
            --title "Dueproof $TAG" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            "${flags[@]}"
