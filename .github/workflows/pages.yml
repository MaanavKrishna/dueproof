name: website
# Publishes apps/site to https://maanavkrishna.github.io/dueproof/ whenever
# the site or the documentation it renders changes.
on:
  push:
    branches: [main]
    paths: ["apps/site/**", "docs/**", "pnpm-lock.yaml", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @dueproof/site build
        env:
          PAGES_BASE_PATH: /dueproof
          NEXT_TELEMETRY_DISABLED: "1"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/site/out
      - id: deployment
        uses: actions/deploy-pages@v4
