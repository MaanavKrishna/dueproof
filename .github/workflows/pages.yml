name: website
# Publishes website/ to GitHub Pages. Run it by hand once Pages is enabled
# for the repository (Settings, Pages, Source: GitHub Actions).
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          PAGES_BASE_PATH: /dueproof
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website/out
      - id: deployment
        uses: actions/deploy-pages@v4
