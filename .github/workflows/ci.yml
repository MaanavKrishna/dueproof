name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"
  TURBO_TELEMETRY_DISABLED: "1"

jobs:
  typescript:
    name: lint, typecheck, test (TypeScript)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint (Biome)
        run: pnpm lint
      - name: Migrations embedded and up to date
        run: pnpm --filter @dueproof/db db:check
      - name: Typecheck
        run: pnpm typecheck
      - name: Tests (Vitest, every package; includes the tenant-isolation suite on PGlite)
        run: pnpm test
      - name: AI eval (recorded mode; fails on any confident-wrong outline)
        run: pnpm --filter @dueproof/ai run eval

  free-build:
    # Self-hosted Free must build, typecheck and pass its tests with the
    # Business directory deleted (house rule 12, ee/README.md).
    name: free build without ee/
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Remove ee/
        run: rm -rf ee
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck (packages and app)
        run: npx turbo run typecheck --filter="./packages/*" --filter=@dueproof/app
      - name: Tests (app)
        run: pnpm --filter @dueproof/app test
      - name: Build (app)
        run: pnpm --filter @dueproof/app build

  engine:
    name: engine tests (Python)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: services/engine
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"
          enable-cache: true
          cache-dependency-glob: services/engine/pyproject.toml
      - name: Tesseract with the Hindi and Malayalam packs
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-hin tesseract-ocr-mal
      - name: Install (CPU PyTorch)
        run: |
          uv venv
          uv pip install torch==2.13.0 --index-url https://download.pytorch.org/whl/cpu
          uv pip install -e ".[dev]"
      - name: Lint
        run: .venv/bin/python -m pyflakes dueproof_engine tests scripts api
      - name: Tests
        # The translation weights are licence-gated and not available in CI;
        # tests that need the real model skip themselves.
        run: .venv/bin/python -m unittest discover -s tests -t . -v

  website:
    name: website build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build (type-checks every page)
        run: pnpm --filter @dueproof/site build

  desktop:
    name: desktop tests (Rust and Vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: WebKitGTK and the other Tauri build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Tests (Vitest)
        run: pnpm --filter @dueproof/desktop test
      - name: Setup screen (the shell embeds it at compile time)
        run: pnpm --filter @dueproof/desktop build:ui
      - name: Tests (cargo)
        run: pnpm --filter @dueproof/desktop test:rust
