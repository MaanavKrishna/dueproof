name: tests
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - name: Tesseract with the Hindi and Malayalam packs
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-hin tesseract-ocr-mal
      - name: Install (CPU PyTorch)
        run: |
          pip install torch==2.13.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"
      - name: Lint
        run: python -m pyflakes dueproof/*.py dueproof/pipeline/*.py dueproof/pipeline/scripts dueproof/profiles dueproof/web dueproof/tools tests
      - name: Check the installation
        run: DUEPROOF_AUTH=none DUEPROOF_DATA=$RUNNER_TEMP/data dueproof doctor
      - name: Tests
        # The translation weights are licence-gated and not available in CI;
        # tests that need the real model skip themselves.
        run: DUEPROOF_PYTHON=python scripts/test.sh
      - name: Extraction quality floors
        run: >
          DUEPROOF_PROFILE=metro_rail_ml DUEPROOF_TRANSLATE=0 DUEPROOF_DATA=$RUNNER_TEMP/eval
          dueproof eval tests/fixtures/labels.jsonl --docs tests/fixtures
          --min-precision 0.95 --min-recall 0.75 --min-deadline 1.0 --max-false-confident 0

  website:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
      - name: Build (type-checks every page)
        run: npm run build
