name: ci
on:
  push:
    branches: [main]
  pull_request:

# Read-only everywhere: no job pushes, comments or publishes.
permissions:
  contents: read

# Every action is pinned to a full commit SHA (the version is in the comment);
# Dependabot moves them (.github/dependabot.yml).

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"
  TURBO_TELEMETRY_DISABLED: "1"

jobs:
  commits:
    name: commit messages
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: No AI attribution trailers
        run: |
          bad=$(git log --format='%H%n%B' | grep -iE '^(co-authored-by|generated-by|assisted-by):.*(claude|anthropic|copilot|openai|chatgpt|gemini|cursor|codex)|claude\.ai/code|generated with \[claude' || true)
          if [ -n "$bad" ]; then
            echo "::error::A commit message carries an AI attribution trailer:"
            echo "$bad"
            exit 1
          fi

  typescript:
    name: lint, typecheck, test (TypeScript)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint (Biome)
        run: pnpm lint
      - name: Migrations embedded and up to date
        run: pnpm --filter @dueproof/db db:check
      - name: Typecheck
        run: pnpm typecheck
      - name: Tests (Vitest, every package; includes the tenant-isolation suite on PGlite)
        run: pnpm test
      - name: AI eval (recorded mode; fails on any confident-wrong outline)
        run: pnpm --filter @dueproof/ai run eval

  free-build:
    # Self-hosted Free must build, typecheck and pass its tests with the
    # Business directory deleted (house rule 12, ee/README.md).
    name: free build without ee/
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Remove ee/
        run: rm -rf ee
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck (packages and app)
        run: npx turbo run typecheck --filter="./packages/*" --filter=@dueproof/app
      - name: Tests (app)
        run: pnpm --filter @dueproof/app test
      - name: Build (app)
        run: pnpm --filter @dueproof/app build

  engine:
    name: engine tests (Python)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: services/engine
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          # The same Python as the engine image (services/engine/Dockerfile).
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: services/engine/uv.lock
      - name: Tesseract with the Hindi and Malayalam packs
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-hin tesseract-ocr-mal
      - name: uv.lock matches pyproject.toml
        run: uv lock --check
      - name: Install from uv.lock (with torch as locked, CPU build)
        # torch comes from PyTorch's CPU index at the version uv.lock holds, as
        # in the image; then the dev group exactly as locked.
        run: |
          torch=$(python3 -c "import tomllib; print(next(p['version'] for p in tomllib.load(open('uv.lock', 'rb'))['package'] if p['name'] == 'torch'))")
          echo "torch $torch (from uv.lock)"
          uv venv
          uv pip install "torch==$torch" --index-url https://download.pytorch.org/whl/cpu
          uv sync --frozen --group dev --inexact
          .venv/bin/python -c "import torch; print('torch', torch.__version__); assert torch.__version__.split('+')[0] == '$torch'; assert not torch.cuda.is_available()"
      - name: Lint
        run: .venv/bin/python -m pyflakes dueproof_engine tests scripts api
      - name: Tests
        # The translation weights are licence-gated and not available in CI;
        # tests that need the real model skip themselves.
        run: .venv/bin/python -m unittest discover -s tests -t . -v

  website:
    name: website build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build (type-checks every page)
        run: pnpm --filter @dueproof/site build

  desktop:
    name: desktop tests (Rust and Vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: WebKitGTK and the other Tauri build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Rust (stable, with rustup on the runner)
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: apps/desktop/src-tauri
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Tests (Vitest)
        run: pnpm --filter @dueproof/desktop test
      - name: Setup screen (the shell embeds it at compile time)
        run: pnpm --filter @dueproof/desktop build:ui
      - name: Tests (cargo, Cargo.lock as committed)
        run: cargo test --locked --manifest-path apps/desktop/src-tauri/Cargo.toml
